<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Image Classifier</title></head>
<body style="font-family:system-ui;max-width:600px;margin:40px auto;padding:0 16px">
  <h2>Image Classifier</h2>
  <input type="file" id="f" accept="image/*">
  <button onclick="go()">Classify</button>
  <img id="prev" style="max-width:100%;margin-top:20px">
  <pre id="out" style="font-size:16px"></pre>

  <script>
  async function go() {
    const f = document.getElementById('f').files[0];
    if (!f) return;
    document.getElementById('prev').src = URL.createObjectURL(f);
    document.getElementById('out').textContent = 'Classifying...';
    const fd = new FormData();
    fd.append('file', f);
    const r = await fetch('/predict', { method: 'POST', body: fd });
    const j = await r.json();
    document.getElementById('out').textContent =
      j.predictions.map(p => `${p.label}: ${(p.confidence*100).toFixed(1)}%`).join('\n');
  }
  </script>
</body>
</html>
